<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Papelaria Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Papelaria Online</h1>
      <p>Materiais escolares para estudar, criar e organizar sua rotina.</p>
    </header>

    <main>
      <section class="cartao">
        <h2>Novo produto</h2>
        <form id="form-produto">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Ex: Caderno" required />

          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" name="preco" step="0.01" min="0" placeholder="Ex: 12.50" required />

          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" name="quantidade" min="1" placeholder="Ex: 10" required />
          <small id="mensagem-validacao" class="mensagem-validacao" aria-live="polite"></small>

          <label for="arquivo">Imagem do produto</label>
          <input type="file" id="arquivo" name="arquivo" accept="image/*" />
          <div class="preview-imagem-container" id="preview-imagem-container" hidden>
            <img id="preview-imagem" alt="Pré-visualização do produto" />
          </div>
          <small id="nome-arquivo">Nenhum arquivo selecionado</small>

          <button type="submit" id="botao-submit">Adicionar produto</button>
        </form>
      </section>

      <section class="cartao">
        <div class="cabecalho-lista">
          <h2>Produtos cadastrados</h2>
          <p id="contador-produtos">Produtos cadastrados: 0</p>
        </div>
        <p id="lista-vazia" class="lista-vazia" hidden>Nenhum produto cadastrado.</p>
        <ul id="lista-produtos"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
